##############################################################################################################
# local
##############################################################################################################
server:
  port: 8091

spring:
  config.activate.on-profile: local
  devtools:
   ##########################################################################################################
   # devtools 사용시 RestartClassLoader를 사용한다. (devtools 미사용시 AppClassLoader사용)
   # Spring Boot Devtools를 사용하면, 프로젝트를 IDE에서 열어 실행할 때 RestartClassLoader가 애플리케이션 클래스를 로드합니다. 
   # (Spring Boot Devtools를 사용하지 않으면, dependency에 정의된 .jar 파일들은 System ClassLoader가 로드)
   # 설정한 의존성(lib)에 따라 RestartClassLoader를 사용시 문제가 발생 하기도 함. (applicationAware를 사용한 Bean 참조 오류 발생)
   # 배치기능중 '로그제외목록' 기능은 devTools을 사용시 오류 발생
   ##########################################################################################################
    livereload.enabled: true
    restart.enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console

springdoc:
  swagger-ui:
    enabled: true

alpha:
  batch:
    webConsole:
      confirmCheckValueYn: N  
    scanConfig: 
      scanPatternList: 
        - /azure.ide/workspace/**/target/classes/META-INF/schedulerMetaInfo.json
  domain:
    board:
      description: board(예제)
      datasource:
        driverClassName: net.sf.log4jdbc.sql.jdbcapi.DriverSpy
        jdbcUrl: jdbc:log4jdbc:h2:mem:board;DB_CLOSE_DELAY=-1;INIT=RUNSCRIPT FROM 'classpath:config/schema/board-schema.sql'
        username: sa
        password:
    score:
      description: score(예제)
      datasource:
        driverClassName: net.sf.log4jdbc.sql.jdbcapi.DriverSpy
        jdbcUrl: jdbc:log4jdbc:h2:mem:score;DB_CLOSE_DELAY=-1;INIT=RUNSCRIPT FROM 'classpath:config/schema/score-schema.sql'
        username: sa
        password:

