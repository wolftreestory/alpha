##################################################################
# 시프링시큐리티 : 인증/권한 미대상
##################################################################
security.default.permitAll:
  - /**/healthcheck
  - /**/api-docs/**
  - /**/swagger
  - /**/swagger-ui/**
  - /**/test/**

##################################################################
# 시프링시큐리티 : 인증 대상
##################################################################
security.default.authenticated:
  - /**

##################################################################
# 시프링시큐리티 : 권한 설정
##################################################################
security.default.roles:
  admin:
    - /**/admin/**
