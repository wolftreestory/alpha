 <body>
  <p id="message"/>
  <script>
  var isEnable=true;
  if(isEnable && window.location.host==""){isEnable=false;}
  if(isEnable && window.location.host.indexOf("localhost")!=-1){isEnable=false;}
  if(isEnable && window.location.host.indexOf("127.0.0.1")!=-1){isEnable=false;}
  
  if(isEnable){location.href = window.location.protocol + "//" + window.location.host;}
  else{document.getElementById("message").innerHTML="404 오류페이지";}
  </script>
 </body>
